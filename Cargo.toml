[package]
name = "bevy-launchpad"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
authors = ["Oleg Alexandrov <alexandrovoleg.ru@gmail.com>"]
description = "A production-ready launcher framework for Bevy games."
license = "MIT or Apache-2.0"
repository = "https://github.com/teratron/bevy-launchpad"
homepage = "https://teratron.github.io/bevy-launchpad"
documentation = "https://docs.rs/bevy-launchpad"
keywords = ["bevy", "game", "launcher", "framework"]
categories = ["game-development", "development-tools"]
readme = "README.md"

[workspace]
members = [".", "examples/*"]

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
bevy-launchpad = { version = "0.2", path = ".", default-features = false }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
clap = { version = "4.5", features = ["derive"] }

[dependencies]
bevy = { workspace = true, default-features = true, features = [] }
serde = { workspace = true }
ron = { workspace = true }
clap = { workspace = true }

[features]
# ── default: everything a typical indie game needs ──────────────────────────
default = ["2d", "3d"]

# ── dimension features ──────────────────────────────────────────────────────
2d = []
3d = []
