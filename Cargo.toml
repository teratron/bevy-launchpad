[package]
name = "bevy-launchpad"
version = "0.1.3"
edition = "2024"
rust-version = "1.93"
authors = ["Oleg Alexandrov <alexandrovoleg.ru@gmail.com>"]
description = "A production-ready launcher framework for Bevy games."
license = "MIT or Apache-2.0"
repository = "https://github.com/teratron/bevy-launchpad"
homepage = "https://teratron.github.io/bevy-launchpad"
documentation = "https://docs.rs/bevy-launchpad"
keywords = ["bevy", "game", "launcher", "framework"]
categories = ["game-development", "development-tools"]
readme = "README.md"

[workspace]
members = [".", "crates/*", "examples/*"]

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
thiserror = "2.0"
clap = { version = "4.5.59", features = ["derive"] }

# ── crate dependencies ──────────────────────────────────────────────────────
bevy-launchpad = { version = "0.1.3", path = ".", default-features = false }
bevy-launchpad-derive = { version = "0.1", path = "./crates/bevy-launchpad-derive" }

# ── proc-macro dependencies ─────────────────────────────────────────────────
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_winit",
    "bevy_gilrs",
    "bevy_ui",
    "bevy_text",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_state",
    "bevy_color",
    "bevy_log",
    "x11",
    "png",
] }
serde = { workspace = true } # Сериализация/десериализация
ron = { workspace = true } # Формат конфигурационных файлов
thiserror = { workspace = true } # Определение типов ошибок в публичной API библиотеке
clap = { workspace = true } # Парсинг аргументов командной строки
bevy-launchpad-derive = { workspace = true } # Макросы для упрощения разработки

[features]
# ── default: everything a typical indie game needs ──────────────────────────
default = ["ui", "locale", "2d", "3d"]

# ── dimension features ──────────────────────────────────────────────────────
2d = ["bevy/bevy_sprite", "bevy/bevy_gizmos"]
3d = ["bevy/bevy_pbr", "bevy/bevy_gizmos"]

# ── optional modules ────────────────────────────────────────────────────────
ui = []     # theme, widgets, menus, modals, transitions
locale = [] # Fluent localization

# ── optional extras ─────────────────────────────────────────────────────────
diagnostics = ["bevy/bevy_dev_tools"]
audio = ["bevy/bevy_audio", "bevy/vorbis"]
embedded_assets = []

# ── convenience bundles ─────────────────────────────────────────────────────
full = ["default", "diagnostics", "audio", "embedded_assets"]
minimal = []                                                  # core only — no UI, no locale
